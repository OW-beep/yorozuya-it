<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="320" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B3550" text-anchor="middle">クエリの発行回数を比較する</text>

  <text x="175" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#B23A3A" text-anchor="middle">N+1問題が起きている場合</text>
  <rect x="55" y="75" width="240" height="34" rx="6" fill="#1B3550"/>
  <text x="175" y="97" font-family="sans-serif" font-size="12" fill="#F6F1E4" text-anchor="middle">①一覧を取得(1回)</text>
  <rect x="55" y="118" width="240" height="30" rx="4" fill="#B23A3A"/>
  <text x="175" y="138" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">著者1の本を取得(2回目)</text>
  <rect x="55" y="152" width="240" height="30" rx="4" fill="#B23A3A"/>
  <text x="175" y="172" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">著者2の本を取得(3回目)</text>
  <rect x="55" y="186" width="240" height="24" rx="4" fill="#B23A3A" opacity="0.6"/>
  <text x="175" y="203" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">… 以下、著者の数だけ続く</text>
  <text x="175" y="235" font-family="sans-serif" font-size="13" font-weight="bold" fill="#B23A3A" text-anchor="middle">合計:1 + N 回</text>

  <line x1="350" y1="55" x2="350" y2="270" stroke="#5C6B78" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="525" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">Eager Loadingで解決した場合</text>
  <rect x="405" y="75" width="240" height="34" rx="6" fill="#1B3550"/>
  <text x="525" y="97" font-family="sans-serif" font-size="12" fill="#F6F1E4" text-anchor="middle">①一覧を取得(1回)</text>
  <rect x="405" y="118" width="240" height="34" rx="6" fill="#D9A441"/>
  <text x="525" y="140" font-family="sans-serif" font-size="12" fill="#1B3550" text-anchor="middle">②関連データをまとめて取得(1回)</text>
  <text x="525" y="235" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">合計:2回で完了</text>
</svg>
