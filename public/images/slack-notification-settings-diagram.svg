<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="300" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">チャンネルごとに通知の強さを変える</text>

  <rect x="60" y="55" width="580" height="210" rx="10" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
  <rect x="60" y="55" width="580" height="34" rx="10" fill="#1B3550"/>
  <text x="80" y="77" font-family="sans-serif" font-size="12" fill="#F6F1E4">チャンネル通知設定</text>

  <text x="90" y="115" font-family="sans-serif" font-size="12" fill="#1B3550"># general(全社連絡)</text>
  <rect x="450" y="100" width="150" height="26" rx="13" fill="#D9A441"/>
  <text x="525" y="118" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">すべての新規メッセージ</text>

  <text x="90" y="160" font-family="sans-serif" font-size="12" fill="#1B3550"># team-chat(雑談)</text>
  <rect x="450" y="145" width="150" height="26" rx="13" fill="#F6F1E4" stroke="#5C6B78"/>
  <text x="525" y="163" font-family="sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">メンションのみ</text>

  <text x="90" y="205" font-family="sans-serif" font-size="12" fill="#1B3550"># project-x(進行中案件)</text>
  <rect x="450" y="190" width="150" height="26" rx="13" fill="#D9A441"/>
  <text x="525" y="208" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">すべての新規メッセージ</text>

  <text x="90" y="250" font-family="sans-serif" font-size="12" fill="#1B3550"># random(お知らせ)</text>
  <rect x="450" y="235" width="150" height="26" rx="13" fill="#F6F1E4" stroke="#5C6B78"/>
  <text x="525" y="253" font-family="sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">通知なし</text>
  <text x="350" y="285" font-family="sans-serif" font-size="11" fill="#5C6B78" text-anchor="middle">重要度の高いチャンネルだけ強めに、それ以外は絞るのがコツ</text>
</svg>
