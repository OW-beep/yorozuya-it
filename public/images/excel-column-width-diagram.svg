<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="260" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">列の境界線を、ダブルクリックするだけ</text>

  <text x="175" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5C6B78" text-anchor="middle">Before</text>
  <rect x="75" y="75" width="200" height="50" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
  <line x1="175" y1="75" x2="175" y2="125" stroke="#D9A441" stroke-width="3"/>
  <text x="125" y="105" font-family="sans-serif" font-size="16" fill="#1B3550" text-anchor="middle">####</text>
  <text x="175" y="150" font-family="sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">↑ この境界線をダブルクリック</text>

  <path d="M300,100 h95" stroke="#5C6B78" stroke-width="2" fill="none" marker-end="url(#arrowEX)"/>

  <text x="525" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#D9A441" text-anchor="middle">After</text>
  <rect x="425" y="75" width="200" height="50" fill="#ffffff" stroke="#D9A441" stroke-width="1.5"/>
  <text x="525" y="105" font-family="sans-serif" font-size="16" fill="#1B3550" text-anchor="middle">2026/8/19</text>

  <text x="350" y="200" font-family="sans-serif" font-size="12" fill="#1B3550" text-anchor="middle">列見出しの右端の境界線にカーソルを合わせ、矢印(⇔)が出たらダブルクリック</text>
</svg>
