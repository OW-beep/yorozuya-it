<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="260" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">エラーメッセージは「案内板」</text>

  <rect x="60" y="55" width="580" height="130" rx="8" fill="#1B3550"/>
  <text x="80" y="85" font-family="monospace" font-size="11" fill="#D9A441">TypeError: Cannot read property 'name' of undefined</text>
  <text x="80" y="105" font-family="monospace" font-size="11" fill="#F6F1E4">at line 42</text>

  <line x1="80" y1="120" x2="620" y2="120" stroke="#5C6B78" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="90" y="145" font-family="sans-serif" font-size="10" fill="#F6F1E4">① 種類:TypeError(型に関するエラー)</text>
  <text x="90" y="163" font-family="sans-serif" font-size="10" fill="#F6F1E4">② 内容:'name'を読み取ろうとしたが対象がundefined</text>

  <text x="350" y="215" font-family="sans-serif" font-size="12" fill="#1B3550" text-anchor="middle">「①種類」+「②内容」+「③発生場所」で検索すると、原因にたどり着きやすい</text>
</svg>
