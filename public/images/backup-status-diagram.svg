<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="300" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">「設定オン」と「バックアップ完了」は別のこと</text>

  <rect x="60" y="70" width="200" height="150" rx="10" fill="#1B3550"/>
  <text x="160" y="100" font-family="sans-serif" font-size="13" fill="#F6F1E4" text-anchor="middle">スマホ本体</text>
  <text x="160" y="130" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">バックアップ設定</text>
  <text x="160" y="150" font-family="sans-serif" font-size="14" font-weight="bold" fill="#D9A441" text-anchor="middle">ON</text>
  <text x="160" y="185" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">(見た目は設定済み)</text>

  <path d="M270,145 h95" stroke="#5C6B78" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrowBK)"/>
  <text x="315" y="130" font-family="sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">Wi-Fi未接続</text>
  <text x="315" y="165" font-family="sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">容量不足で停止</text>

  <rect x="440" y="70" width="200" height="150" rx="10" fill="#ffffff" stroke="#D9A441" stroke-width="2"/>
  <text x="540" y="100" font-family="sans-serif" font-size="13" fill="#1B3550" text-anchor="middle">クラウド側</text>
  <text x="540" y="130" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">最終バックアップ</text>
  <text x="540" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#D9A441" text-anchor="middle">3ヶ月前で停止</text>
  <text x="540" y="185" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">(実際は反映されていない)</text>

  <text x="350" y="260" font-family="sans-serif" font-size="13" fill="#1B3550" text-anchor="middle">確認すべきは「設定のON/OFF」ではなく「最終バックアップ日時」</text>

  <defs>
    <marker id="arrowBK" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5C6B78" />
    </marker>
  </defs>
</svg>
