<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="300" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B3550" text-anchor="middle">サーキットブレーカーの3つの状態</text>

  <circle cx="120" cy="150" r="75" fill="#1B3550"/>
  <text x="120" y="145" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F6F1E4" text-anchor="middle">Closed</text>
  <text x="120" y="165" font-family="sans-serif" font-size="11" fill="#EFE7D3" text-anchor="middle">(通常通り)</text>

  <path d="M205,130 h60" stroke="#5C6B78" stroke-width="3" marker-end="url(#arrowB)"/>
  <text x="235" y="120" font-family="sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">失敗が続く</text>

  <circle cx="350" cy="150" r="75" fill="#B23A3A"/>
  <text x="350" y="145" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F6F1E4" text-anchor="middle">Open</text>
  <text x="350" y="165" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">(即座に遮断)</text>

  <path d="M435,170 h60" stroke="#5C6B78" stroke-width="3" marker-end="url(#arrowB)"/>
  <text x="465" y="185" font-family="sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">一定時間後</text>

  <circle cx="580" cy="150" r="75" fill="#D9A441"/>
  <text x="580" y="145" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1B3550" text-anchor="middle">Half-Open</text>
  <text x="580" y="165" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">(試験的に通す)</text>

  <path d="M540,215 q-210,60 -420,0" stroke="#5C6B78" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrowB)"/>
  <text x="350" y="270" font-family="sans-serif" font-size="11" fill="#5C6B78" text-anchor="middle">試験が成功すればClosedへ、失敗すれば再びOpenへ</text>

  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5C6B78" />
    </marker>
  </defs>
</svg>
