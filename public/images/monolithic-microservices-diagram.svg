<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="320" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">一軒家型と、集合住宅型</text>

  <text x="175" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">モノリシック(一軒家)</text>
  <rect x="75" y="80" width="200" height="160" rx="6" fill="#1B3550"/>
  <line x1="75" y1="130" x2="275" y2="130" stroke="#F6F1E4" stroke-width="1.5"/>
  <line x1="75" y1="180" x2="275" y2="180" stroke="#F6F1E4" stroke-width="1.5"/>
  <line x1="145" y1="80" x2="145" y2="240" stroke="#F6F1E4" stroke-width="1.5"/>
  <text x="110" y="110" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">画面</text>
  <text x="210" y="110" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">注文</text>
  <text x="110" y="160" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">決済</text>
  <text x="210" y="160" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">在庫</text>
  <text x="175" y="215" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">全部同じ建物の中</text>
  <text x="175" y="265" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">1箇所直すと全体を建て直す</text>

  <text x="525" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">マイクロサービス(集合住宅)</text>
  <rect x="440" y="80" width="70" height="60" rx="6" fill="#D9A441"/>
  <text x="475" y="115" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">画面</text>
  <rect x="525" y="80" width="70" height="60" rx="6" fill="#D9A441"/>
  <text x="560" y="115" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">注文</text>
  <rect x="610" y="80" width="70" height="60" rx="6" fill="#D9A441"/>
  <text x="645" y="115" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">決済</text>
  <rect x="440" y="160" width="70" height="60" rx="6" fill="#D9A441"/>
  <text x="475" y="195" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">在庫</text>
  <rect x="525" y="160" width="70" height="60" rx="6" fill="#D9A441"/>
  <text x="560" y="195" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">通知</text>
  <rect x="610" y="160" width="70" height="60" rx="6" fill="#D9A441"/>
  <text x="645" y="195" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">検索</text>
  <text x="560" y="265" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">1部屋だけ直して他はそのまま</text>

  <line x1="330" y1="70" x2="330" y2="270" stroke="#5C6B78" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
