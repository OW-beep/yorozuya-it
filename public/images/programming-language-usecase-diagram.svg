<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="300" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">「言語」ではなく「用途」で選ぶ</text>

  <rect x="40" y="65" width="150" height="80" rx="8" fill="#1B3550"/>
  <text x="115" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F6F1E4" text-anchor="middle">Webサイトの</text>
  <text x="115" y="112" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F6F1E4" text-anchor="middle">画面</text>
  <text x="115" y="132" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">JavaScript</text>

  <rect x="215" y="65" width="150" height="80" rx="8" fill="#5C6B78"/>
  <text x="290" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F6F1E4" text-anchor="middle">データ分析・</text>
  <text x="290" y="112" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F6F1E4" text-anchor="middle">AI</text>
  <text x="290" y="132" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">Python</text>

  <rect x="390" y="65" width="150" height="80" rx="8" fill="#D9A441"/>
  <text x="465" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1B3550" text-anchor="middle">スマホアプリ</text>
  <text x="465" y="112" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1B3550" text-anchor="middle">(iOS/Android)</text>
  <text x="465" y="132" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">Swift / Kotlin</text>

  <rect x="565" y="65" width="105" height="80" rx="8" fill="#1B3550"/>
  <text x="617" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F6F1E4" text-anchor="middle">業務システム</text>
  <text x="617" y="112" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F6F1E4" text-anchor="middle">の裏側</text>
  <text x="617" y="132" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">Java</text>

  <text x="350" y="185" font-family="sans-serif" font-size="13" fill="#1B3550" text-anchor="middle">「どの言語が一番優れているか」ではなく</text>
  <text x="350" y="210" font-family="sans-serif" font-size="13" fill="#1B3550" text-anchor="middle">「何を作りたいか」で使う言語が変わる</text>
  <text x="350" y="245" font-family="sans-serif" font-size="12" fill="#5C6B78" text-anchor="middle">同じ目的の中でも、複数の言語が候補になることが多い</text>
</svg>
