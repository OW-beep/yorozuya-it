<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="320" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">リバースプロキシは「会社の受付係」</text>

  <g>
    <rect x="30" y="120" width="80" height="60" rx="8" fill="#1B3550"/>
    <text x="70" y="145" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">利用者</text>
    <text x="70" y="160" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">A</text>

    <rect x="30" y="30" width="80" height="60" rx="8" fill="#1B3550"/>
    <text x="70" y="55" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">利用者</text>
    <text x="70" y="70" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">B</text>

    <rect x="30" y="210" width="80" height="60" rx="8" fill="#1B3550"/>
    <text x="70" y="235" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">利用者</text>
    <text x="70" y="250" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">C</text>
  </g>

  <path d="M112,60 L275,150" stroke="#5C6B78" stroke-width="2" fill="none" marker-end="url(#arrowRP)"/>
  <path d="M112,150 L275,150" stroke="#5C6B78" stroke-width="2" fill="none" marker-end="url(#arrowRP)"/>
  <path d="M112,240 L275,150" stroke="#5C6B78" stroke-width="2" fill="none" marker-end="url(#arrowRP)"/>

  <rect x="280" y="105" width="130" height="90" rx="10" fill="#D9A441"/>
  <text x="345" y="140" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">受付係</text>
  <text x="345" y="158" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">(リバース</text>
  <text x="345" y="173" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">プロキシ)</text>

  <path d="M415,130 L560,60" stroke="#5C6B78" stroke-width="2" fill="none" marker-end="url(#arrowRP)"/>
  <path d="M415,150 L560,150" stroke="#5C6B78" stroke-width="2" fill="none" marker-end="url(#arrowRP)"/>
  <path d="M415,170 L560,240" stroke="#5C6B78" stroke-width="2" fill="none" marker-end="url(#arrowRP)"/>

  <g>
    <rect x="565" y="30" width="105" height="60" rx="8" fill="#1B3550"/>
    <text x="617" y="55" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">サーバー1</text>
    <text x="617" y="70" font-family="sans-serif" font-size="9" fill="#F6F1E4" text-anchor="middle">(奥の担当者)</text>

    <rect x="565" y="120" width="105" height="60" rx="8" fill="#1B3550"/>
    <text x="617" y="145" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">サーバー2</text>
    <text x="617" y="160" font-family="sans-serif" font-size="9" fill="#F6F1E4" text-anchor="middle">(奥の担当者)</text>

    <rect x="565" y="210" width="105" height="60" rx="8" fill="#1B3550"/>
    <text x="617" y="235" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">サーバー3</text>
    <text x="617" y="250" font-family="sans-serif" font-size="9" fill="#F6F1E4" text-anchor="middle">(奥の担当者)</text>
  </g>

  <text x="350" y="295" font-family="sans-serif" font-size="13" fill="#1B3550" text-anchor="middle">利用者は受付(1つの窓口)としか話さず、奥に何人いるかを意識しない</text>

  <defs>
    <marker id="arrowRP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5C6B78" />
    </marker>
  </defs>
</svg>
