<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="400" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B3550" text-anchor="middle">現場で見てきた「困りごと」ランキング</text>

  <g font-family="sans-serif">
    <rect x="40" y="50" width="620" height="30" rx="4" fill="#1B3550"/>
    <text x="55" y="70" font-size="13" fill="#F6F1E4">1位 パスワードが分からない</text>

    <rect x="40" y="85" width="580" height="28" rx="4" fill="#1B3550" opacity="0.9"/>
    <text x="55" y="104" font-size="13" fill="#F6F1E4">2位 スマホのストレージ不足</text>

    <rect x="40" y="118" width="540" height="28" rx="4" fill="#1B3550" opacity="0.8"/>
    <text x="55" y="137" font-size="13" fill="#F6F1E4">3位 Wi-Fiがつながらない</text>

    <rect x="40" y="151" width="500" height="26" rx="4" fill="#D9A441"/>
    <text x="55" y="169" font-size="12" fill="#1B3550">4位 アカウント(ログイン・ロック)</text>

    <rect x="40" y="182" width="470" height="26" rx="4" fill="#D9A441" opacity="0.9"/>
    <text x="55" y="200" font-size="12" fill="#1B3550">5位 バックアップの「つもり」問題</text>

    <rect x="40" y="213" width="440" height="26" rx="4" fill="#D9A441" opacity="0.8"/>
    <text x="55" y="231" font-size="12" fill="#1B3550">6位 アップデートのやる・やらない</text>

    <rect x="40" y="244" width="410" height="26" rx="4" fill="#EFE7D3" stroke="#1B3550" stroke-width="1.5"/>
    <text x="55" y="262" font-size="12" fill="#1B3550">7位 キャッシュレス決済トラブル</text>

    <rect x="40" y="275" width="380" height="26" rx="4" fill="#EFE7D3" stroke="#1B3550" stroke-width="1.5"/>
    <text x="55" y="293" font-size="12" fill="#1B3550">8位 位置情報のズレ・取得不可</text>
  </g>

  <text x="350" y="335" font-family="sans-serif" font-size="13" fill="#5C6B78" text-anchor="middle">順位を分けるのは「頻度」だけでなく「止まった時のダメージの大きさ」</text>
  <text x="350" y="360" font-family="sans-serif" font-size="13" font-weight="bold" fill="#B23A3A" text-anchor="middle">共通点:「確認していない前提」で使い続けていること</text>
</svg>
