<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="320" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B3550" text-anchor="middle">スピードメーターで見る、対応スピードの変化</text>

  <!-- gauge 1: slow -->
  <g transform="translate(190,175)">
    <path d="M-110,0 A110,110 0 0 1 110,0" fill="none" stroke="#EFE7D3" stroke-width="22"/>
    <path d="M-110,0 A110,110 0 0 1 -20,-108" fill="none" stroke="#1B3550" stroke-width="22"/>
    <line x1="0" y1="0" x2="-70" y2="-60" stroke="#B23A3A" stroke-width="5" stroke-linecap="round"/>
    <circle r="8" fill="#B23A3A"/>
    <text y="45" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">従来:数週間</text>
  </g>

  <line x1="350" y1="60" x2="350" y2="290" stroke="#5C6B78" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- gauge 2: fast -->
  <g transform="translate(510,175)">
    <path d="M-110,0 A110,110 0 0 1 110,0" fill="none" stroke="#EFE7D3" stroke-width="22"/>
    <path d="M-110,0 A110,110 0 0 1 100,-40" fill="none" stroke="#D9A441" stroke-width="22"/>
    <line x1="0" y1="0" x2="85" y2="-15" stroke="#B23A3A" stroke-width="5" stroke-linecap="round"/>
    <circle r="8" fill="#B23A3A"/>
    <text y="45" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">現在:数時間</text>
  </g>

  <text x="350" y="300" font-family="sans-serif" font-size="12" fill="#5C6B78" text-anchor="middle">針が右に振れるほど、悪用までの猶予が短い</text>
</svg>
