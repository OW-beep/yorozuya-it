<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="300" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B3550" text-anchor="middle">PSEマークは2種類ある</text>

  <circle cx="180" cy="140" r="70" fill="none" stroke="#1B3550" stroke-width="6"/>
  <text x="180" y="150" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1B3550" text-anchor="middle">PSE</text>
  <text x="180" y="235" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">マルPSE</text>
  <text x="180" y="255" font-family="sans-serif" font-size="11" fill="#5C6B78" text-anchor="middle">モバイルバッテリー本体は</text>
  <text x="180" y="270" font-family="sans-serif" font-size="11" fill="#5C6B78" text-anchor="middle">こちらの対象</text>

  <rect x="450" y="80" width="120" height="120" fill="none" stroke="#D9A441" stroke-width="6" transform="rotate(45 510 140)"/>
  <text x="510" y="150" font-family="sans-serif" font-size="20" font-weight="bold" fill="#D9A441" text-anchor="middle">PSE</text>
  <text x="510" y="235" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">ひし形PSE</text>
  <text x="510" y="255" font-family="sans-serif" font-size="11" fill="#5C6B78" text-anchor="middle">ACアダプターなど</text>
  <text x="510" y="270" font-family="sans-serif" font-size="11" fill="#5C6B78" text-anchor="middle">対象品目が異なる</text>
</svg>
