<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="280" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">音の種類で、原因の見当がつく</text>

  <rect x="40" y="60" width="150" height="110" rx="8" fill="#1B3550"/>
  <text x="115" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F6F1E4" text-anchor="middle">ブーン</text>
  <text x="115" y="110" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">連続した低い音</text>
  <text x="115" y="135" font-family="sans-serif" font-size="10" fill="#D9A441" text-anchor="middle">ファンの</text>
  <text x="115" y="150" font-family="sans-serif" font-size="10" fill="#D9A441" text-anchor="middle">高速回転</text>

  <rect x="215" y="60" width="150" height="110" rx="8" fill="#1B3550"/>
  <text x="290" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F6F1E4" text-anchor="middle">カタカタ</text>
  <text x="290" y="110" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">断続的な音</text>
  <text x="290" y="135" font-family="sans-serif" font-size="10" fill="#D9A441" text-anchor="middle">HDDの</text>
  <text x="290" y="150" font-family="sans-serif" font-size="10" fill="#D9A441" text-anchor="middle">読み書き動作</text>

  <rect x="390" y="60" width="150" height="110" rx="8" fill="#1B3550"/>
  <text x="465" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F6F1E4" text-anchor="middle">キュルキュル</text>
  <text x="465" y="110" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">高い摩擦音</text>
  <text x="465" y="135" font-family="sans-serif" font-size="10" fill="#D9A441" text-anchor="middle">ファンの</text>
  <text x="465" y="150" font-family="sans-serif" font-size="10" fill="#D9A441" text-anchor="middle">軸の劣化</text>

  <rect x="565" y="60" width="105" height="110" rx="8" fill="#1B3550"/>
  <text x="617" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F6F1E4" text-anchor="middle">ピー</text>
  <text x="617" y="110" font-family="sans-serif" font-size="10" fill="#F6F1E4" text-anchor="middle">一時的な音</text>
  <text x="617" y="135" font-family="sans-serif" font-size="10" fill="#D9A441" text-anchor="middle">起動時の</text>
  <text x="617" y="150" font-family="sans-serif" font-size="10" fill="#D9A441" text-anchor="middle">自己診断</text>

  <text x="350" y="215" font-family="sans-serif" font-size="12" fill="#1B3550" text-anchor="middle">「カタカタ」「キュルキュル」は特に、放置すると故障につながりやすい音</text>
</svg>
