<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="300" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">見た目は同じでも、中身は違う</text>

  <text x="175" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">セルA(数値)</text>
  <rect x="75" y="80" width="200" height="60" fill="#ffffff" stroke="#1B3550" stroke-width="2"/>
  <text x="255" y="118" font-family="sans-serif" font-size="18" fill="#1B3550" text-anchor="end">1,000</text>
  <text x="175" y="165" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">右寄せで表示される</text>
  <text x="175" y="185" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1B3550" text-anchor="middle">→ SUMで計算対象になる</text>

  <text x="525" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">セルB(文字列)</text>
  <rect x="425" y="80" width="200" height="60" fill="#ffffff" stroke="#D9A441" stroke-width="2"/>
  <text x="435" y="118" font-family="sans-serif" font-size="18" fill="#1B3550" text-anchor="start">1,000</text>
  <text x="525" y="165" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">左寄せで表示される</text>
  <text x="525" y="185" font-family="sans-serif" font-size="12" font-weight="bold" fill="#D9A441" text-anchor="middle">→ SUMで無視される</text>

  <text x="350" y="240" font-family="sans-serif" font-size="13" fill="#1B3550" text-anchor="middle">数字の「寄せ」の向きだけが、見分けるヒント</text>
  <text x="350" y="262" font-family="sans-serif" font-size="12" fill="#5C6B78" text-anchor="middle">(他のシステムからのコピーや、先頭の見えない空白でも同じ現象が起きる)</text>
</svg>
