<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="340" fill="#F6F1E4"/>
  <text x="350" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">初期化する前に、この7項目を確認</text>

  <g font-family="sans-serif" font-size="12" fill="#1B3550">
    <rect x="50" y="55" width="280" height="42" rx="6" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
    <rect x="60" y="66" width="16" height="16" rx="3" fill="none" stroke="#1B3550" stroke-width="1.5"/>
    <path d="M63,74 l4,4 l7,-8" stroke="#D9A441" stroke-width="2" fill="none"/>
    <text x="90" y="81">連絡先・写真</text>

    <rect x="370" y="55" width="280" height="42" rx="6" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
    <rect x="380" y="66" width="16" height="16" rx="3" fill="none" stroke="#1B3550" stroke-width="1.5"/>
    <path d="M383,74 l4,4 l7,-8" stroke="#D9A441" stroke-width="2" fill="none"/>
    <text x="410" y="81">メッセージ・SMS履歴</text>

    <rect x="50" y="107" width="280" height="42" rx="6" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
    <rect x="60" y="118" width="16" height="16" rx="3" fill="none" stroke="#D9A441" stroke-width="1.5"/>
    <text x="90" y="133">LINEのトーク履歴</text>

    <rect x="370" y="107" width="280" height="42" rx="6" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
    <rect x="380" y="118" width="16" height="16" rx="3" fill="none" stroke="#D9A441" stroke-width="1.5"/>
    <text x="410" y="133">認証アプリ(2段階認証)</text>

    <rect x="50" y="159" width="280" height="42" rx="6" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
    <rect x="60" y="170" width="16" height="16" rx="3" fill="none" stroke="#D9A441" stroke-width="1.5"/>
    <text x="90" y="185">電子マネー・ポイント</text>

    <rect x="370" y="159" width="280" height="42" rx="6" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
    <rect x="380" y="170" width="16" height="16" rx="3" fill="none" stroke="#D9A441" stroke-width="1.5"/>
    <text x="410" y="185">ゲームのセーブデータ</text>

    <rect x="210" y="211" width="280" height="42" rx="6" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
    <rect x="220" y="222" width="16" height="16" rx="3" fill="none" stroke="#D9A441" stroke-width="1.5"/>
    <text x="250" y="237">各アプリのログイン情報</text>
  </g>

  <text x="350" y="285" font-family="sans-serif" font-size="12" fill="#1B3550" text-anchor="middle">チェックの済んだ項目(左)より、右側4項目の方が見落としやすい</text>
  <text x="350" y="308" font-family="sans-serif" font-size="12" fill="#5C6B78" text-anchor="middle">「アプリを入れ直せば元通り」ではなく、1つずつ個別に移行方法を確認する</text>
