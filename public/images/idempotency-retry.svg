<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="320" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B3550" text-anchor="middle">通信が不安定な時、再送信するとどうなるか</text>

  <text x="175" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">冪等性が無い場合</text>
  <rect x="50" y="75" width="120" height="45" rx="6" fill="#1B3550"/>
  <text x="110" y="102" font-family="sans-serif" font-size="12" fill="#F6F1E4" text-anchor="middle">送信 1回目</text>
  <path d="M110,120 v20" stroke="#5C6B78" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="110" y="158" font-family="sans-serif" font-size="11" fill="#5C6B78" text-anchor="middle">タイムアウト</text>
  <rect x="190" y="75" width="120" height="45" rx="6" fill="#B23A3A"/>
  <text x="250" y="102" font-family="sans-serif" font-size="12" fill="#F6F1E4" text-anchor="middle">再送信</text>
  <text x="250" y="145" font-family="sans-serif" font-size="12" fill="#B23A3A" text-anchor="middle" font-weight="bold">→ 決済が2回実行</text>

  <line x1="350" y1="55" x2="350" y2="290" stroke="#5C6B78" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="525" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">冪等性がある場合</text>
  <rect x="400" y="75" width="120" height="45" rx="6" fill="#1B3550"/>
  <text x="460" y="95" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">送信 1回目</text>
  <text x="460" y="110" font-family="sans-serif" font-size="9" fill="#EFE7D3" text-anchor="middle">(冪等キー付き)</text>
  <path d="M460,120 v20" stroke="#5C6B78" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="460" y="158" font-family="sans-serif" font-size="11" fill="#5C6B78" text-anchor="middle">タイムアウト</text>
  <rect x="540" y="75" width="120" height="45" rx="6" fill="#D9A441"/>
  <text x="600" y="95" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">再送信</text>
  <text x="600" y="110" font-family="sans-serif" font-size="9" fill="#1B3550" text-anchor="middle">(同じキー)</text>
  <text x="530" y="145" font-family="sans-serif" font-size="12" fill="#1B3550" text-anchor="middle" font-weight="bold">→ 決済は1回分のまま</text>

  <text x="350" y="270" font-family="sans-serif" font-size="13" fill="#1B3550" text-anchor="middle">「同じ結果になる」よう作られているかどうかが、冪等性の有無</text>

  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#5C6B78" />
    </marker>
  </defs>
</svg>
