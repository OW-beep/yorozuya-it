<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="300" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B3550" text-anchor="middle">LINE引き継ぎの基本の流れ</text>

  <rect x="30" y="70" width="150" height="90" rx="10" fill="#1B3550"/>
  <text x="105" y="105" font-family="sans-serif" font-size="13" fill="#F6F1E4" text-anchor="middle">①旧端末で</text>
  <text x="105" y="127" font-family="sans-serif" font-size="13" fill="#F6F1E4" text-anchor="middle">事前準備</text>
  <text x="105" y="149" font-family="sans-serif" font-size="10" fill="#EFE7D3" text-anchor="middle">(電話番号・パスワード確認)</text>

  <path d="M182,115 h50" stroke="#5C6B78" stroke-width="3" marker-end="url(#arrow9)"/>

  <rect x="235" y="70" width="150" height="90" rx="10" fill="#1B3550"/>
  <text x="310" y="105" font-family="sans-serif" font-size="13" fill="#F6F1E4" text-anchor="middle">②バックアップ</text>
  <text x="310" y="127" font-family="sans-serif" font-size="13" fill="#F6F1E4" text-anchor="middle">を取得</text>
  <text x="310" y="149" font-family="sans-serif" font-size="10" fill="#EFE7D3" text-anchor="middle">(トーク履歴を保存)</text>

  <path d="M387,115 h50" stroke="#5C6B78" stroke-width="3" marker-end="url(#arrow9)"/>

  <rect x="440" y="70" width="150" height="90" rx="10" fill="#D9A441"/>
  <text x="515" y="105" font-family="sans-serif" font-size="13" fill="#1B3550" text-anchor="middle">③新端末で</text>
  <text x="515" y="127" font-family="sans-serif" font-size="13" fill="#1B3550" text-anchor="middle">ログイン・復元</text>
  <text x="515" y="149" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">(旧端末を消す前に確認)</text>

  <line x1="60" y1="200" x2="640" y2="200" stroke="#1B3550" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="350" y="228" font-family="sans-serif" font-size="14" font-weight="bold" fill="#D9A441" text-anchor="middle">③が終わるまで、旧端末は初期化しない</text>
  <text x="350" y="252" font-family="sans-serif" font-size="12" fill="#5C6B78" text-anchor="middle">(最大の落とし穴:焦って旧端末を先に消してしまうこと)</text>

  <defs>
    <marker id="arrow9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5C6B78" />
    </marker>
  </defs>
</svg>
