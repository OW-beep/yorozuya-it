<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="280" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">電源を入れた瞬間、実は同時にたくさん動いている</text>

  <rect x="270" y="55" width="160" height="45" rx="6" fill="#1B3550"/>
  <text x="350" y="82" font-family="sans-serif" font-size="12" fill="#F6F1E4" text-anchor="middle">電源ON</text>

  <path d="M300,100 L150,150" stroke="#5C6B78" stroke-width="1.5" fill="none"/>
  <path d="M330,100 L280,150" stroke="#5C6B78" stroke-width="1.5" fill="none"/>
  <path d="M370,100 L420,150" stroke="#5C6B78" stroke-width="1.5" fill="none"/>
  <path d="M400,100 L550,150" stroke="#5C6B78" stroke-width="1.5" fill="none"/>

  <rect x="80" y="150" width="140" height="50" rx="6" fill="#D9A441"/>
  <text x="150" y="180" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">チャットアプリ</text>

  <rect x="230" y="150" width="140" height="50" rx="6" fill="#D9A441"/>
  <text x="300" y="180" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">クラウド同期</text>

  <rect x="380" y="150" width="140" height="50" rx="6" fill="#D9A441"/>
  <text x="450" y="180" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">常駐セキュリティ</text>

  <rect x="480" y="150" width="140" height="50" rx="6" fill="#D9A441"/>
  <text x="550" y="180" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">アップデート確認</text>

  <text x="350" y="235" font-family="sans-serif" font-size="12" fill="#1B3550" text-anchor="middle">これらが一斉に立ち上がろうとするため、起動直後は特に重くなりやすい</text>
</svg>
