<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="340" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B3550" text-anchor="middle">スタートメニューが開かない時の対処フロー</text>

  <rect x="270" y="55" width="160" height="50" rx="8" fill="#1B3550"/>
  <text x="350" y="85" font-family="sans-serif" font-size="13" fill="#F6F1E4" text-anchor="middle">まず再起動する</text>

  <line x1="350" y1="105" x2="350" y2="130" stroke="#5C6B78" stroke-width="2"/>
  <text x="365" y="122" font-family="sans-serif" font-size="11" fill="#5C6B78">直らない</text>

  <rect x="270" y="135" width="160" height="50" rx="8" fill="#1B3550"/>
  <text x="350" y="158" font-family="sans-serif" font-size="12" fill="#F6F1E4" text-anchor="middle">エクスプローラーを</text>
  <text x="350" y="175" font-family="sans-serif" font-size="12" fill="#F6F1E4" text-anchor="middle">再起動する</text>

  <line x1="350" y1="185" x2="350" y2="210" stroke="#5C6B78" stroke-width="2"/>
  <text x="365" y="202" font-family="sans-serif" font-size="11" fill="#5C6B78">直らない</text>

  <rect x="270" y="215" width="160" height="50" rx="8" fill="#1B3550"/>
  <text x="350" y="238" font-family="sans-serif" font-size="12" fill="#F6F1E4" text-anchor="middle">Windows Updateを</text>
  <text x="350" y="255" font-family="sans-serif" font-size="12" fill="#F6F1E4" text-anchor="middle">確認する</text>

  <line x1="350" y1="265" x2="350" y2="290" stroke="#5C6B78" stroke-width="2"/>
  <text x="365" y="282" font-family="sans-serif" font-size="11" fill="#5C6B78">それでも直らない</text>

  <rect x="270" y="295" width="160" height="40" rx="8" fill="#D9A441"/>
  <text x="350" y="320" font-family="sans-serif" font-size="12" fill="#1B3550" text-anchor="middle">システムファイル修復へ</text>
</svg>
