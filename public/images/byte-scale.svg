<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="260" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B3550" text-anchor="middle">物差しで見る、単位の目盛り</text>

  <line x1="60" y1="130" x2="640" y2="130" stroke="#1B3550" stroke-width="4"/>

  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="90" cy="130" r="9" fill="#1B3550"/>
    <text x="90" y="100" font-size="13" font-weight="bold" fill="#1B3550">B</text>
    <text x="90" y="160" font-size="11" fill="#5C6B78">文字数文字</text>

    <circle cx="220" cy="130" r="9" fill="#1B3550"/>
    <text x="220" y="100" font-size="13" font-weight="bold" fill="#1B3550">KB</text>
    <text x="220" y="160" font-size="11" fill="#5C6B78">短い文章</text>

    <circle cx="350" cy="130" r="9" fill="#1B3550"/>
    <text x="350" y="100" font-size="13" font-weight="bold" fill="#1B3550">MB</text>
    <text x="350" y="160" font-size="11" fill="#5C6B78">写真1枚</text>

    <circle cx="480" cy="130" r="10" fill="#D9A441"/>
    <text x="480" y="100" font-size="14" font-weight="bold" fill="#1B3550">GB</text>
    <text x="480" y="160" font-size="11" fill="#5C6B78">動画数分〜</text>

    <circle cx="610" cy="130" r="11" fill="#D9A441"/>
    <text x="610" y="100" font-size="14" font-weight="bold" fill="#1B3550">TB</text>
    <text x="610" y="160" font-size="11" fill="#5C6B78">HDD/SSD容量</text>
  </g>

  <path d="M115,130 h80" stroke="#5C6B78" stroke-width="1.5" marker-end="url(#arrow8)"/>
  <path d="M245,130 h80" stroke="#5C6B78" stroke-width="1.5" marker-end="url(#arrow8)"/>
  <path d="M375,130 h80" stroke="#5C6B78" stroke-width="1.5" marker-end="url(#arrow8)"/>
  <path d="M505,130 h80" stroke="#5C6B78" stroke-width="1.5" marker-end="url(#arrow8)"/>

  <text x="350" y="215" font-family="sans-serif" font-size="13" fill="#1B3550" text-anchor="middle">目盛り1つ進むごとに、およそ1000倍ずつ大きくなる</text>

  <defs>
    <marker id="arrow8" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#5C6B78" />
    </marker>
  </defs>
</svg>
