<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="300" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B3550" text-anchor="middle">歯車で見る「主導権」の違い</text>

  <text x="170" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">ライブラリ</text>
  <g transform="translate(170,150)">
    <circle r="55" fill="none" stroke="#1B3550" stroke-width="10" stroke-dasharray="14 10"/>
    <circle r="30" fill="#EFE7D3" stroke="#1B3550" stroke-width="3"/>
    <text y="6" font-family="sans-serif" font-size="12" fill="#1B3550" text-anchor="middle">部品</text>
  </g>
  <path d="M170,70 v25" stroke="#D9A441" stroke-width="4" marker-end="url(#arrow7)"/>
  <text x="170" y="245" font-family="sans-serif" font-size="12" fill="#5C6B78" text-anchor="middle">自分が必要な時だけ回す</text>

  <line x1="350" y1="55" x2="350" y2="270" stroke="#5C6B78" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="530" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B3550" text-anchor="middle">フレームワーク</text>
  <g transform="translate(530,155)">
    <circle r="70" fill="#1B3550"/>
    <text y="-20" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">フレームワーク</text>
    <circle cx="0" cy="15" r="24" fill="#D9A441"/>
    <text y="20" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">自分の</text>
    <text y="33" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">コード</text>
  </g>
  <text x="530" y="255" font-family="sans-serif" font-size="12" fill="#5C6B78" text-anchor="middle">大きな歯車が、決まったタイミングで回す</text>

  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#D9A441" />
    </marker>
  </defs>
</svg>
