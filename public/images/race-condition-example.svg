<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="340" fill="#F6F1E4"/>
  <text x="350" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B3550" text-anchor="middle">同時に処理が走ると、残高チェックがすり抜けられる</text>

  <text x="175" y="55" font-family="sans-serif" font-size="12" fill="#5C6B78" text-anchor="middle">処理A(出金1万円)</text>
  <text x="525" y="55" font-family="sans-serif" font-size="12" fill="#5C6B78" text-anchor="middle">処理B(出金1万円)</text>
  <line x1="350" y1="45" x2="350" y2="300" stroke="#5C6B78" stroke-width="1" stroke-dasharray="3 4"/>

  <rect x="90" y="70" width="170" height="30" rx="4" fill="#1B3550"/>
  <text x="175" y="90" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">残高確認:1万円 → OK</text>

  <rect x="440" y="105" width="170" height="30" rx="4" fill="#1B3550"/>
  <text x="525" y="125" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">残高確認:1万円 → OK</text>

  <rect x="90" y="140" width="170" height="30" rx="4" fill="#B23A3A"/>
  <text x="175" y="160" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">1万円を出金</text>

  <rect x="440" y="175" width="170" height="30" rx="4" fill="#B23A3A"/>
  <text x="525" y="195" font-family="sans-serif" font-size="11" fill="#F6F1E4" text-anchor="middle">1万円を出金</text>

  <rect x="230" y="230" width="240" height="50" rx="6" fill="#B23A3A" opacity="0.15" stroke="#B23A3A" stroke-width="2"/>
  <text x="350" y="252" font-family="sans-serif" font-size="12" font-weight="bold" fill="#B23A3A" text-anchor="middle">結果:残高1万円のはずが</text>
  <text x="350" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#B23A3A" text-anchor="middle">合計2万円が引き出されてしまう</text>

  <text x="350" y="315" font-family="sans-serif" font-size="12" fill="#1B3550" text-anchor="middle">「確認」と「実行」の間に、割り込まれることが原因</text>
</svg>
