<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="320" fill="#F6F1E4"/>
  <text x="350" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1B3550" text-anchor="middle">ロックされたら、まずこの順番で確認</text>

  <rect x="270" y="50" width="160" height="45" rx="8" fill="#1B3550"/>
  <text x="350" y="77" font-family="sans-serif" font-size="12" fill="#F6F1E4" text-anchor="middle">ログインできない</text>

  <path d="M350,95 v25" stroke="#5C6B78" stroke-width="2" marker-end="url(#arrowAL)"/>

  <rect x="245" y="120" width="210" height="45" rx="8" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
  <text x="350" y="147" font-family="sans-serif" font-size="12" fill="#1B3550" text-anchor="middle">① 表示メッセージを確認</text>

  <path d="M350,165 v20" stroke="#5C6B78" stroke-width="2" marker-end="url(#arrowAL)"/>

  <path d="M240,220 L350,185 L460,220 L350,255 Z" fill="#D9A441"/>
  <text x="350" y="215" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">単純な</text>
  <text x="350" y="230" font-family="sans-serif" font-size="11" fill="#1B3550" text-anchor="middle">回数超過?</text>

  <path d="M240,220 h-90" stroke="#5C6B78" stroke-width="2" marker-end="url(#arrowAL)"/>
  <text x="150" y="212" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">YES</text>
  <rect x="20" y="225" width="180" height="45" rx="8" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
  <text x="110" y="245" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">② 時間を置いて</text>
  <text x="110" y="260" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">再度ログイン</text>

  <path d="M460,220 h90" stroke="#5C6B78" stroke-width="2" marker-end="url(#arrowAL)"/>
  <text x="550" y="212" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">NO</text>
  <rect x="500" y="225" width="180" height="45" rx="8" fill="#ffffff" stroke="#1B3550" stroke-width="1.5"/>
  <text x="590" y="245" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">③ 本人確認による</text>
  <text x="590" y="260" font-family="sans-serif" font-size="10" fill="#1B3550" text-anchor="middle">解除手続きへ</text>

  <text x="350" y="300" font-family="sans-serif" font-size="11" fill="#5C6B78" text-anchor="middle">③は登録メール・電話番号が古いと難航しやすいため、事前の最新化が重要</text>

  <defs>
    <marker id="arrowAL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5C6B78" />
    </marker>
  </defs>
</svg>
